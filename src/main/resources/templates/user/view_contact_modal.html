<div data-th-fragment="view_contact">

  <!-- View Contact Modal -->
  <div id="view_contact_modal"
       tabindex="-1"
       aria-hidden="true"
       class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative p-4 w-full max-w-2xl max-h-full">
      
      <!-- Modal content -->
      <div class="relative bg-white rounded-xl shadow-lg dark:bg-gray-800 transition-all">
        
        <!-- Header -->
        <div class="flex items-center justify-between p-5 border-b border-gray-200 dark:border-gray-700">
          <h3 id="contact_name" class="text-2xl font-semibold text-gray-900 dark:text-white">
            Contact Details
          </h3>
          <button type="button"
                  class="text-gray-400 hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 flex justify-center items-center dark:hover:bg-gray-700 dark:hover:text-white"
                  data-modal-hide="view_contact_modal">
            <svg class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
            </svg>
          </button>
        </div>

        <!-- Body -->
        <div class="p-6 space-y-6">
          <div class="flex flex-col md:flex-row gap-6 items-center">
            <img id="contact_picture" src=""
                 alt="Contact Picture"
                 class="w-32 h-32 rounded-full object-cover border-4 border-gray-200 dark:border-gray-700 shadow-md" />
            <div class="space-y-2 text-gray-700 dark:text-gray-300">
              <p><strong>Email:</strong> <span id="contact_email"></span></p>
              <p><strong>Phone:</strong> <span id="contact_phone"></span></p>
              <p><strong>Address:</strong> <span id="contact_address"></span></p>
              <p><strong>Favorite:</strong> <span id="contact_favorite"></span></p>
            </div>
          </div>

          <div>
            <h4 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">Additional Information</h4>
            <p id="contact_description" class="text-gray-600 dark:text-gray-400"></p>
          </div>

          <div>
            <h4 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">Social Links</h4>
            <ul id="contact_social_links" class="space-y-2"></ul>
          </div>
        </div>

        <!-- Footer -->
        <div class="flex justify-end gap-3 p-5 border-t border-gray-200 dark:border-gray-700">
          <button data-modal-hide="view_contact_modal"
                  type="button"
                  class="py-2.5 px-6 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600">
            Close
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
