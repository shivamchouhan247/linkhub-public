<!DOCTYPE html>
<html lang="en" data-th-replace="~{user/user_base :: parent(~{::#content},~{::title},~{::script})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src\main\resources\static\css\errormessage.css" />
    <title>Add Contact</title>
</head>

<body>
    <div id="content">
        <div class="p-4 sm:p-8 sm:ml-64 mt-14">
            <div class="flex items-center justify-center min-h-screen">
                <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl dark:bg-gray-800 overflow-hidden">

                    <!-- Heading -->
                    <div class=" pt-4 flex items-center justify-center">
                        <h5 class="  text-3xl font-bold text-gray-900 dark:text-white tracking-tight">Add New
                            Contact
                        </h5>
                    </div>
                    <p class=" px-4 flex items-center justify-center text-sm text-gray-500 dark:text-gray-400 mt-0.5 ">
                        Seamlessly stored in the cloud — email your client instantly via SCM.</p>


                    <!--Alert Message Here-->
                    <div class=" px-8 py-6">
                        <p data-th-replace="~{message::alertbox}"></p>
                    </div>

                    <!-- Form Content -->
                    <div class="px-8 py-6">

                        <form data-th-object="${contactForm}" data-th-action="@{'/user/contacts/add'}" method="post"
                            class="space-y-8" enctype="multipart/form-data" novalidate>
                            <!--enctype="multipart/form-data"-->
                            <!-- Profile Photo Section -->
                            <div class="flex flex-col items-center pb-6 border-b border-gray-200 dark:border-gray-700">
                                <div class="relative group mb-3">
                                    <input data-th-field="*{contactImage}" type="file" name="contactImage"
                                        id="profile-image" accept="image/*" class="hidden">
                                    <label for="profile-image" class="cursor-pointer block">
                                        <div id="image-preview"
                                            class="w-32 h-32 rounded-full bg-gray-100 dark:bg-gray-700 border-2 border-gray-200 dark:border-gray-600 flex items-center justify-center overflow-hidden transition-all duration-300 hover:border-blue-500 dark:hover:border-blue-400 relative">
                                            <!-- Placeholder -->
                                            <div id="placeholder-content" class="text-center">
                                                <div
                                                    class="w-32 h-32 rounded-full bg-gray-200 dark:bg-gray-600 flex items-center justify-center">
                                                    <svg class="w-16 h-16 text-gray-400 dark:text-gray-500"
                                                        fill="currentColor" viewBox="0 0 20 20">
                                                        <path
                                                            d="M10 0a10 10 0 1 0 10 10A10.011 10.011 0 0 0 10 0Zm0 5a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm0 13a8.949 8.949 0 0 1-4.951-1.488A3.987 3.987 0 0 1 9 13h2a3.987 3.987 0 0 1 3.951 3.512A8.949 8.949 0 0 1 10 18Z" />
                                                    </svg>
                                                </div>
                                            </div>
                                            <!-- Preview Image -->
                                            <img id="preview-img" class="hidden w-full h-full object-cover"
                                                alt="Preview">
                                            <!-- Hover Overlay -->
                                            <div
                                                class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-40 transition-all duration-300 rounded-full flex items-center justify-center">
                                                <svg class="w-8 h-8 text-white opacity-0 group-hover:opacity-100 transition-opacity duration-300"
                                                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        stroke-width="2"
                                                        d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z">
                                                    </path>
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                                </svg>
                                            </div>
                                        </div>
                                    </label>
                                    <!-- Remove Button -->
                                    <button type="button" id="remove-image"
                                        class="hidden absolute -bottom-1 -right-1 bg-red-500 hover:bg-red-600 text-white rounded-full p-2 shadow-lg transition-all duration-200 z-10">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                            stroke-width="3">
                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                d="M6 18L18 6M6 6l12 12"></path>
                                        </svg>
                                    </button>
                                </div>
                                <button type="button" onclick="document.getElementById('profile-image').click()"
                                    class="text-blue-600 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300 text-sm font-medium transition-colors">
                                    Add Photo
                                </button>
                                <p data-th-if="${#fields.hasErrors('contactImage')}" data-th-errors="*{contactImage}"
                                    class="mt-2 text-sm text-red-600 px-2">
                                </p>
                            </div>

                            <!-- Basic Information Section -->
                            <div class="space-y-5">
                                <h3
                                    class="text-sm font-semibold text-gray-900 dark:text-white uppercase tracking-wider flex items-center">
                                    <svg class="w-4 h-4 mr-2 text-blue-600 dark:text-blue-400" fill="none"
                                        stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z">
                                        </path>
                                    </svg>
                                    Basic Information
                                </h3>

                                <!-- Name -->
                                <div>
                                    <label for="name"
                                        class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">Full
                                        Name</label>
                                    <input data-th-field="*{name}" type="text" placeholder="Full Name" required
                                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block w-full p-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:placeholder-gray-400 transition-all" />

                                    <p data-th-if="${#fields.hasErrors('name')}" data-th-errors="*{name}"
                                        class="mt-2 text-sm text-red-600 px-2">
                                    </p>
                                </div>

                                <!-- Email -->
                                <div>
                                    <label for="email"
                                        class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">Email
                                        Address</label>
                                    <input data-th-field="*{email}" type="email" placeholder="name@example.com"
                                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block w-full p-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:placeholder-gray-400 transition-all" />
                                </div>
                                <div>
                                    <p data-th-if="${#fields.hasErrors('email')}" data-th-errors="*{email}"
                                        class="mt-2 text-sm text-red-600 px-2">
                                    </p>
                                </div>

                                <!-- Phone -->
                                <div>
                                    <label for="phone"
                                        class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">Phone
                                        Number</label>
                                    <div class="flex gap-2">
                                        <select id="countryCode" name="countryCode"
                                            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-3 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-200 transition-all w-28">
                                            <option value="+1">🇺🇸 +1</option>
                                            <option value="+44">🇬🇧 +44</option>
                                            <option value="+91" selected>🇮🇳 +91</option>
                                            <option value="+61">🇦🇺 +61</option>
                                            <option value="+81">🇯🇵 +81</option>
                                            <option value="+49">🇩🇪 +49</option>
                                            <option value="+971">🇦🇪 +971</option>
                                        </select>
                                        <input data-th-field="*{phoneNumber}" type="tel" placeholder="123-456-7890"
                                            required
                                            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block flex-1 p-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:placeholder-gray-400 transition-all" />

                                    </div>
                                    <p data-th-if="${#fields.hasErrors('phoneNumber')}" data-th-errors="*{phoneNumber}"
                                        class="mt-2 text-sm text-red-600 px-2">
                                    </p>
                                </div>

                                <div class="flex items-center me-4">
                                    <input data-th-field="*{favorite}" checked type="checkbox" value=""
                                        class="w-4 h-4 text-purple-600 bg-gray-100 border-gray-300 rounded-sm focus:ring-purple-500 dark:focus:ring-purple-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
                                    <label for="purple-checkbox"
                                        class="ms-2 text-sm font-medium text-gray-900 dark:text-gray-300">Mark as
                                        Favorite</label>
                                </div>
                            </div>

                            <!-- Address Section -->
                            <div class="space-y-5 pt-6 border-t border-gray-200 dark:border-gray-700">
                                <h3
                                    class="text-sm font-semibold text-gray-900 dark:text-white uppercase tracking-wider flex items-center">
                                    <svg class="w-4 h-4 mr-2 text-blue-600 dark:text-blue-400" fill="none"
                                        stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z">
                                        </path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    </svg>
                                    Address
                                </h3>

                                <div>
                                    <label for="address"
                                        class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">Street
                                        Address</label>
                                    <textarea data-th-field="*{address}" rows="3" placeholder="123 Main Street, Apt 4B"
                                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block w-full p-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:placeholder-gray-400 transition-all resize-none"></textarea>
                                    <p data-th-if="${#fields.hasErrors('address')}" data-th-errors="*{address}"
                                        class="mt-2 text-sm text-red-600 px-2">
                                    </p>
                                </div>
                            </div>

                            <!-- Additional Information Section -->
                            <div class="space-y-5 pt-6 border-t border-gray-200 dark:border-gray-700">
                                <h3
                                    class="text-sm font-semibold text-gray-900 dark:text-white uppercase tracking-wider flex items-center">
                                    <svg class="w-4 h-4 mr-2 text-blue-600 dark:text-blue-400" fill="none"
                                        stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                                        </path>
                                    </svg>
                                    Additional Information
                                </h3>

                                <div>
                                    <label for="description"
                                        class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">Notes</label>
                                    <textarea data-th-field="*{description}" rows="3"
                                        placeholder="Add any additional notes about this contact"
                                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block w-full p-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:placeholder-gray-400 transition-all resize-none"></textarea>


                                    <p data-th-if="${#fields.hasErrors('description')}" data-th-errors="*{description}"
                                        class="mt-2 text-sm text-red-600 px-2">
                                    </p>
                                </div>
                            </div>

                            <!-- Social Links Section -->
                            <div class="space-y-4 pt-6 border-t border-gray-200 dark:border-gray-700">
                                <div class="flex justify-between items-center">
                                    <h3
                                        class="text-sm font-semibold text-gray-900 dark:text-white uppercase tracking-wider flex items-center">
                                        <svg class="w-4 h-4 mr-2 text-blue-600 dark:text-blue-400" fill="none"
                                            stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1">
                                            </path>
                                        </svg>
                                        Social Links
                                    </h3>
                                    <button type="button" id="add-social-link"
                                        class="inline-flex items-center px-3 py-2 text-sm font-medium text-blue-600 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300 hover:bg-blue-50 dark:hover:bg-gray-700 rounded-lg transition-all">
                                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                                        </svg>
                                        Add Link
                                    </button>
                                </div>

                                <div id="social-links-container" class="space-y-3">
                                    <!-- Social links will be added here dynamically -->
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="flex gap-3 pt-6">
                                <button type="submit"
                                    class="flex-1 text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-6 py-3 transition-all duration-200 shadow-sm hover:shadow-md">
                                    Save Contact
                                </button>
                                <button type="button" onclick="window.history.back()"
                                    class="px-6 py-3 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:ring-4 focus:ring-gray-200 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600 transition-all duration-200">
                                    Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        console.log("Add contact page loaded");

        let socialLinkCount = 0;

        // Image Upload Handling
        const profileImageInput = document.getElementById('profile-image');
        const imagePreview = document.getElementById('image-preview');
        const previewImg = document.getElementById('preview-img');
        const placeholderContent = document.getElementById('placeholder-content');
        const removeImageBtn = document.getElementById('remove-image');

        profileImageInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                // Validate file size (max 5MB)
                if (file.size > 5 * 1024 * 1024) {
                    alert('File size must be less than 5MB');
                    return;
                }

                // Validate file type
                if (!file.type.match('image.*')) {
                    alert('Please select an image file');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function (e) {
                    previewImg.src = e.target.result;
                    previewImg.classList.remove('hidden');
                    placeholderContent.classList.add('hidden');
                    removeImageBtn.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        removeImageBtn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            profileImageInput.value = '';
            previewImg.src = '';
            previewImg.classList.add('hidden');
            placeholderContent.classList.remove('hidden');
            removeImageBtn.classList.add('hidden');
        });

        document.getElementById('add-social-link').addEventListener('click', function () {
            const container = document.getElementById('social-links-container');

            // ✅ Limit to only 3 social link boxes
            if (container.children.length >= 3) {
                alert('You can only add up to 3 social links.');
                return;
            }

            const linkId = 'social-link-' + socialLinkCount++;

            const linkElement = document.createElement('div');
            linkElement.className = 'bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 rounded-lg p-4 space-y-3 animate-fadeIn';
            linkElement.id = linkId;

            linkElement.innerHTML = `
        <div class="flex justify-between items-center">
            <div class="flex items-center">
                <div class="w-8 h-8 bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center mr-3">
                    <svg class="w-4 h-4 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                    </svg>
                </div>
                <span class="text-sm font-medium text-gray-900 dark:text-white">Social Link</span>
            </div>
            <button type="button" class="remove-link text-gray-400 hover:text-red-600 dark:hover:text-red-400 transition-colors p-1" data-link-id="${linkId}" title="Remove link">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
                <label class="block mb-1.5 text-xs font-medium text-gray-700 dark:text-gray-300">Platform</label>
                <input type="text" name="socialLinks[${socialLinkCount - 1}].title" class="bg-white dark:bg-gray-600 border border-gray-300 dark:border-gray-500 text-gray-900 dark:text-white text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 placeholder-gray-400 transition-all" placeholder="LinkedIn, Twitter, GitHub">
            </div>
            <div>
                <label class="block mb-1.5 text-xs font-medium text-gray-700 dark:text-gray-300">Profile URL</label>
                <input type="url" name="socialLinks[${socialLinkCount - 1}].link" class="bg-white dark:bg-gray-600 border border-gray-300 dark:border-gray-500 text-gray-900 dark:text-white text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 placeholder-gray-400 transition-all" placeholder="https://linkedin.com/in/username">
            </div>
        </div>
    `;

            container.appendChild(linkElement);

            // Remove functionality with animation
            linkElement.querySelector('.remove-link').addEventListener('click', function (e) {
                const linkIdToRemove = e.currentTarget.dataset.linkId;
                const elementToRemove = document.getElementById(linkIdToRemove);
                elementToRemove.style.transition = 'all 0.3s ease-out';
                elementToRemove.style.opacity = '0';
                elementToRemove.style.transform = 'translateX(-10px)';
                setTimeout(() => {
                    elementToRemove.remove();
                }, 300);
            });

            // Scroll to the new element
            setTimeout(() => {
                linkElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        });


        // Add CSS animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .animate-fadeIn {
                animation: fadeIn 0.3s ease-out;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>

</html>
