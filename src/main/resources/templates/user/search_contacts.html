<!DOCTYPE html>
<html lang="en" data-th-replace="~{user/user_base::parent(~{::#content},~{::title},~{::script})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts</title>
</head>

<body>
    <div id="content" class="mt-8 sm:mt-12 p-4 sm:p-6 sm:ml-64">

        <!-- Header Section -->
        <div class="mt-4 mb-6 sm:mb-8">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div
                        class="p-2.5 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl shadow-lg shadow-blue-500/30">
                        <svg class="w-6 h-6 " fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white tracking-tight">Contacts
                        </h1>
                        <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-0.5">Manage and organize your
                            connections</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 sm:self-auto self-end">
                    <div class="text-right">
                        <p data-th-text="${pageContact.getTotalElements}"
                            class="text-xl sm:text-2xl font-bold text-gray-900 dark:text-white">5</p>
                        <p class="text-xs text-gray-500 dark:text-gray-400">Total Contacts</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modern Card Container -->
        <div
            class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">


            <!-- Search Feature Form -->
            <form data-th-object="${searchContact}" data-th-action="@{'/user/contacts/search'}" method="get">
                <!-- Search and Actions Bar -->
                <div class="p-6 border-b border-gray-200 dark:border-gray-700">
                    <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-start">
                        <!--Select Field-->
                        <div class="">
                            <select data-th-field="*{field}"
                                class="inline-flex items-center gap- px-8 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600 transition-all">
                                <div
                                    class="py-4 text-sm text-gray-700 dark:text-gray-200 z-10 bg-white divide-y divide-gray-100 rounded-xl shadow-lg w-48 dark:bg-gray-700 dark:divide-gray-600 border border-gray-200 dark:border-gray-600">
                                    <option value="" selected
                                        class="block px-4 py-2.5 hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors">
                                        Select an option</option>
                                    <option value="name"
                                        class="block px-4 py-2.5 hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors">
                                        Name</option>
                                    <option value="phone"
                                        class="block px-4 py-2.5 hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors">
                                        Phone</option>
                                    <option value="email"
                                        class="block px-4 py-2.5 hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors">
                                        Email</option>
                                </div>
                            </select>
                        </div>

                        <!-- Search Input -->
                        <div class="relative w-full sm:w-96">
                            <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                            </div>
                            <input data-th-field="*{key}" type="text" id="table-search-users"
                                class="w-full pl-12 pr-4 py-2.5 text-sm text-gray-900 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white transition-all"
                                placeholder="Search contacts...">
                        </div>

                        <!--Search Button-->
                        <button
                            class="inline-flex items-center gap-2 px-4 py-2.5 text-sm font-mediumborder-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-800 text-white bg-blue-700 hover:bg-blue-800 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800  transition-all"
                            type="submit">
                            Search
                        </button>

                    </div>
                </div>
            </form>


            <!-- Table Container -->
            <div data-th-if="${!pageContact.empty}" class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead
                        class="text-xs font-semibold uppercase text-gray-600 dark:text-gray-400 bg-gray-50 dark:bg-gray-700/50">
                        <tr>
                            <th scope="col" class="px-4 sm:px-6 py-3 sm:py-4 text-left whitespace-nowrap">Contact</th>
                            <th scope="col" class="px-4 sm:px-6 py-3 sm:py-4 text-left whitespace-nowrap">Phone</th>
                            <th scope="col" class="px-4 sm:px-6 py-3 sm:py-4 text-left whitespace-nowrap">Favorite</th>
                            <th scope="col" class="px-4 sm:px-6 py-3 sm:py-4 text-left whitespace-nowrap">Links</th>
                            <th scope="col" class="px-4 sm:px-6 py-3 sm:py-4 text-right whitespace-nowrap">Actions</th>
                        </tr>
                    </thead>
                    <tbody data-th-each="contact : ${pageContact.content}" data-th-object="${contact}">
                        <tr data-th-id="'row-'+ ${contact.contactId}"
                            class="border-b border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">

                            <!-- Contact Info -->
                            <td class="px-4 sm:px-6 py-3 sm:py-4">
                                <div class="flex items-center gap-3 sm:gap-4 min-w-max">
                                    <img class="w-10 h-10 sm:w-12 sm:h-12 rounded-full object-cover ring-2 ring-gray-100 dark:ring-gray-700 flex-shrink-0"
                                        data-th-src="*{picture}" alt="User image">
                                    <div class="min-w-0">
                                        <div data-th-text="*{name}"
                                            class="font-semibold text-gray-900 dark:text-white mb-0.5 truncate"></div>
                                        <div data-th-text="*{email}"
                                            class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 truncate"></div>
                                    </div>
                                </div>
                            </td>

                            <!-- Phone -->
                            <td data-th-text="*{phoneNumber}"
                                class="px-4 sm:px-6 py-3 sm:py-4 text-gray-700 dark:text-gray-300 whitespace-nowrap">
                            </td>

                            <!-- Favorite -->
                            <td class="px-4 sm:px-6 py-3 sm:py-4">
                                <div data-th-if="*{favorite}">
                                    <svg class="w-5 h-5" viewBox="0 0 20 20" fill="#F59E0B">
                                        <path
                                            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                                    </svg>
                                </div>
                            </td>

                            <!-- Social Links -->
                            <td data-th-if="*{socialLinks}" class="px-6 py-4">
                                <div class="flex gap-2">
                                    <div data-th-each="socialLink : *{socialLinks}" data-th-object="${socialLink}">
                                        <span data-th-switch="*{title.toLowerCase()}">
                                            <!-- YouTube -->
                                            <a data-th-case="'youtube'" data-th-href="@{*{link}}" target="_blank"
                                                class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-red-50 hover:bg-red-100 dark:bg-red-900/20 dark:hover:bg-red-900/30 transition-colors">
                                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="#DC2626">
                                                    <path
                                                        d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
                                                </svg>
                                            </a>

                                            <!-- LinkedIn -->
                                            <a data-th-case="'linkedin'" data-th-href="@{*{link}}" target="_blank"
                                                class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-blue-50 hover:bg-blue-100 dark:bg-blue-900/20 dark:hover:bg-blue-900/30 transition-colors">
                                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="#0077B5">
                                                    <path
                                                        d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
                                                </svg>
                                            </a>

                                            <!-- Default Link -->
                                            <a data-th-case="*" data-th-href="@{*{link}}" target="_blank"
                                                class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 transition-colors">
                                                <svg class="w-4 h-4 text-gray-600 dark:text-gray-400" fill="none"
                                                    stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        stroke-width="2"
                                                        d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                                                </svg>
                                            </a>
                                        </span>
                                    </div>
                                </div>
                            </td>

                            <!-- Actions -->
                            <td class="px-4 sm:px-6 py-3 sm:py-4">
                                <div class="flex gap-1.5 sm:gap-2 justify-end">
                                    <!-- view contact details -->
                                    <button data-th-id="${contact.contactId}" onclick="loadContactDetails(this.id)"
                                        class="inline-flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-lg text-gray-600 hover:bg-blue-50 hover:text-blue-600 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-blue-400 transition-colors"
                                        title="View">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                        </svg>
                                    </button>
                                    <!-- update contact details button -->
                                    <a data-th-href="'/user/contacts/update/'+${contact.contactId}"
                                        class="inline-flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-lg text-gray-600 hover:bg-green-50 hover:text-green-600 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-green-400 transition-colors"
                                        title="Edit">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                        </svg>
                                    </a>
                                    <!-- delete contact details -->
                                    <button data-th-id="${contact.contactId}" onclick="openDeleteConfirmation(this.id)"
                                        class="inline-flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-lg text-gray-600 hover:bg-red-50 hover:text-red-600 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-red-400 transition-colors"
                                        title="Delete">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                        </svg>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination Footer -->
            <div data-th-if="${!pageContact.empty}" class="p-4 sm:p-6 border-t border-gray-200 dark:border-gray-700">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4">

                    <!-- Results Info -->
                    <div class="text-xs sm:text-sm text-gray-600 dark:text-gray-400 order-2 sm:order-1">
                        Showing
                        <span class="font-semibold text-gray-900 dark:text-white"
                            data-th-text="${pageContact.number * pageContact.size + 1}">1</span>
                        to
                        <span class="font-semibold text-gray-900 dark:text-white"
                            data-th-text="${(pageContact.number + 1) * pageContact.size > pageContact.totalElements ? pageContact.totalElements : (pageContact.number + 1) * pageContact.size}">10</span>
                        of
                        <span class="font-semibold text-gray-900 dark:text-white"
                            data-th-text="${pageContact.totalElements}">100</span>
                    </div>

                    <!-- Pagination Controls -->
                    <nav aria-label="Page navigation" class="order-1 sm:order-2">
                        <ul class="inline-flex items-center gap-1 sm:gap-2">

                            <!-- Previous Button -->
                            <li>
                                <a data-th-href="@{'/user/contacts/search?field='+${searchContact.field}+'&key='+${searchContact.key}+'&size=' + ${pageSize} + '&page=' + ${pageContact.number}}"
                                    data-th-classappend="${pageContact.number == 0} ? 'pointer-events-none opacity-40' : ''"
                                    class="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 rounded-xl text-gray-600 bg-white border border-gray-300 hover:bg-gray-50 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-700 transition-all duration-200">
                                    <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M15 19l-7-7 7-7" />
                                    </svg>
                                </a>
                            </li>

                            <!-- Page Numbers -->
                            <li data-th-each="index : ${#numbers.sequence(
                                pageContact.number + 1 <= 3 ? 1 : (pageContact.number + 1 >= pageContact.totalPages - 2 ? (pageContact.totalPages > 5 ? pageContact.totalPages - 4 : 1) : pageContact.number - 1),
                                pageContact.number + 1 <= 3 ? (pageContact.totalPages > 5 ? 5 : pageContact.totalPages) : (pageContact.number + 1 >= pageContact.totalPages - 2 ? pageContact.totalPages : pageContact.number + 3)
                            )}">
                                <a data-th-href="@{'/user/contacts/search?field='+${searchContact.field}+'&key='+${searchContact.key}+'&size=' + ${pageSize} + '&page=' + ${index}}"
                                    data-th-text="${index}"
                                    data-th-classappend="${pageContact.number + 1 == index} ? 'bg-gradient-to-br from-blue-500 to-blue-600  border-blue-600 shadow-lg shadow-blue-500/30' : 'text-gray-700 bg-white border-gray-300 hover:bg-gray-50 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-700'"
                                    class="flex items-center justify-center w-9 h-9 sm:min-w-10 sm:h-10 sm:px-3 rounded-xl text-xs sm:text-sm font-medium border transition-all duration-200">
                                </a>
                            </li>

                            <!-- Next Button -->
                            <li>
                                <a data-th-href="@{'/user/contacts/search?field='+${searchContact.field}+'&key='+${searchContact.key}+'&size=' + ${pageSize} + '&page=' + ${pageContact.number + 2}}"
                                    data-th-classappend="${pageContact.number + 1 >= pageContact.totalPages} ? 'pointer-events-none opacity-40' : ''"
                                    class="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 rounded-xl text-gray-600 bg-white border border-gray-300 hover:bg-gray-50 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-700 transition-all duration-200">
                                    <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M9 5l7 7-7 7" />
                                    </svg>
                                </a>
                            </li>

                        </ul>
                    </nav>

                    <!-- Empty spacer -->
                    <div class="hidden sm:block w-24 order-3"></div>

                </div>
            </div>

            <!-- No Result Found -->
            <div data-th-if="${pageContact.empty}" class="p-6 text-center">
                <div
                    class="flex flex-col items-center justify-center min-h-[120px] py-6 px-4 rounded-lg bg-white dark:bg-gray-800  transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-gray-400 mb-3 dark:text-gray-500"
                        fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <h2 class="text-gray-700 dark:text-gray-200 font-semibold text-lg mb-1">No Contacts Found</h2>
                    <p class="text-gray-500 dark:text-gray-400 text-sm max-w-md">
                        It looks like you haven’t added any contacts yet. Try adding a new one or refining your search.
                    </p>
                </div>
            </div>

            <!--view contact details modal-->
            <div class="flex content-center justify-center" id="view_contact_modal"
                data-th-replace="~{user/view_contact_modal :: view_contact}"> </div>

        </div>

    </div>

    <script data-th-src="@{/js/contact.js}">
        console.log("Welcome to searched contacts")
    </script>
</body>

</html>
